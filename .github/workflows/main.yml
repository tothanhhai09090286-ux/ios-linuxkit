name: Build LinuxKit iOS ARM64

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: xcode-27

    steps:

      # ========================================
      # 1. CHECKOUT
      # ========================================
      - name: Checkout LinuxKit
        uses: actions/checkout@v4
        with:
          submodules: recursive


      # ========================================
      # 2. CHECK XCODE
      # ========================================
      - name: Check Xcode and iOS SDK
        run: |
          echo "=== XCODE ==="
          xcodebuild -version

          echo
          echo "=== IOS SDK ==="
          xcrun --sdk iphoneos --show-sdk-version


      # ========================================
      # 3. BUILD
      # ========================================
      - name: Build iSH-ARM64
        shell: bash
        run: |
          set +e

          DERIVED="$GITHUB_WORKSPACE/build/DerivedData"

          MESON_LIB="$DERIVED/Build/Products/Debug-ApplePleaseFixFB19282108-iphoneos"

          RELEASE_LIB="$DERIVED/Build/Products/Release-iphoneos"

          echo "========================================"
          echo "BUILD iSH-ARM64"
          echo "========================================"

          echo "MESON LIB:"
          echo "$MESON_LIB"

          echo
          echo "RELEASE LIB:"
          echo "$RELEASE_LIB"

          echo
          echo "========================================"
          echo "XCODE BUILD"
          echo "========================================"

          xcodebuild \
            -project iSH.xcodeproj \
            -scheme iSH-ARM64 \
            -configuration Debug-ApplePleaseFixFB19282108 \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            LIBRARY_SEARCH_PATHS="$MESON_LIB $RELEASE_LIB" \
            OTHER_LDFLAGS="-L$MESON_LIB -L$RELEASE_LIB" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build > build.log 2>&1

          STATUS=$?

          echo
          echo "========================================"
          echo "LIBRARIES CREATED"
          echo "========================================"

          find "$DERIVED/Build/Products" \
            \( \
              -name "libish.a" \
              -o -name "libish_emu.a" \
              -o -name "libfakefs.a" \
              -o -name "libarchive.a" \
            \) \
            -type f \
            -print

          echo
          echo "========================================"
          echo "LINKER COMMAND"
          echo "========================================"

          grep -n "Ld " build.log | tail -5 || true

          echo
          echo "========================================"
          echo "ERRORS"
          echo "========================================"

          grep -inE \
            "error:|ld:|Undefined symbols|not found|failed" \
            build.log \
            | tail -80 || true

          echo
          echo "========================================"
          echo "BUILD STATUS"
          echo "========================================"

          echo "$STATUS"

          exit "$STATUS"


      # ========================================
      # 4. FIND APP
      # ========================================
      - name: Find application
        if: success()
        run: |
          echo "=== APPLICATION ==="

          find build/DerivedData/Build/Products \
            -name "*.app" \
            -type d \
            -print


      # ========================================
      # 5. PACKAGE
      # ========================================
      - name: Package application
        if: success()
        run: |
          set -e

          APP_PATH=$(find build/DerivedData/Build/Products \
            -name "*.app" \
            -type d \
            | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found"
            exit 1
          fi

          echo "APPLICATION:"
          echo "$APP_PATH"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/

          rm -f LinuxKit-iSH-ARM64.zip

          zip -r LinuxKit-iSH-ARM64.zip Payload


      # ========================================
      # 6. UPLOAD
      # ========================================
      - name: Upload LinuxKit build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LinuxKit-iSH-ARM64
          path: LinuxKit-iSH-ARM64.zip
          if-no-files-found: error
