name: Build LinuxKit iOS ARM64

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: xcode-27

    steps:

      # ========================================
      # 1. CHECKOUT
      # ========================================
      - name: Checkout LinuxKit
        uses: actions/checkout@v4
        with:
          submodules: recursive


      # ========================================
      # 2. INSTALL BUILD TOOLS
      # ========================================
      - name: Install LLVM Meson and Ninja
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "INSTALL BUILD TOOLS"
          echo "========================================"

          brew install llvm meson ninja

          LLVM_PREFIX="$(brew --prefix llvm)"

          echo
          echo "LLVM PREFIX:"
          echo "$LLVM_PREFIX"

          echo
          echo "========================================"
          echo "TOOL PATHS"
          echo "========================================"

          echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"

          export PATH="$LLVM_PREFIX/bin:$PATH"

          echo
          echo "CLANG:"
          command -v clang
          clang --version

          echo
          echo "LLD:"
          command -v ld.lld
          ld.lld --version

          echo
          echo "MESON:"
          command -v meson
          meson --version

          echo
          echo "NINJA:"
          command -v ninja
          ninja --version


      # ========================================
      # 3. CHECK XCODE
      # ========================================
      - name: Check Xcode and iOS SDK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "XCODE"
          echo "========================================"

          xcodebuild -version

          echo
          echo "XCODE SELECT:"
          xcode-select -p

          echo
          echo "IOS SDK:"
          xcrun --sdk iphoneos --show-sdk-version

          echo
          echo "========================================"
          echo "BUILD TOOLS"
          echo "========================================"

          command -v clang
          clang --version

          command -v ld.lld
          ld.lld --version

          command -v meson
          meson --version

          command -v ninja
          ninja --version


      # ========================================
      # 4. BUILD iSH-ARM64
      # ========================================
      - name: Build iSH-ARM64
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "BUILD iSH-ARM64"
          echo "========================================"

          echo
          echo "PATH:"
          echo "$PATH"

          echo
          echo "CLANG:"
          command -v clang
          clang --version

          echo
          echo "LLD:"
          command -v ld.lld
          ld.lld --version

          echo
          echo "MESON:"
          command -v meson
          meson --version

          echo
          echo "NINJA:"
          command -v ninja
          ninja --version

          echo
          echo "========================================"
          echo "XCODEBUILD"
          echo "========================================"

          xcodebuild \
            -project iSH.xcodeproj \
            -scheme iSH-ARM64 \
            -configuration Debug-ApplePleaseFixFB19282108 \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build > build.log 2>&1

          STATUS=$?

          echo
          echo "========================================"
          echo "IMPORTANT ERRORS"
          echo "========================================"

          grep -inE \
            "error:|Error:|FAILED|failed|fatal|cannot|not found|Undefined symbols|unknown type name|undeclared" \
            build.log \
            | tail -120 || true

          echo
          echo "========================================"
          echo "MESON / NINJA"
          echo "========================================"

          grep -inE \
            "meson|ninja" \
            build.log \
            | tail -80 || true

          echo
          echo "========================================"
          echo "LIBRARIES"
          echo "========================================"

          find build/DerivedData/Build/Products \
            \( \
              -name "libish.a" \
              -o -name "libish_emu.a" \
              -o -name "libfakefs.a" \
              -o -name "libarchive.a" \
            \) \
            -type f \
            -print

          echo
          echo "========================================"
          echo "BUILD STATUS"
          echo "========================================"

          echo "$STATUS"

          exit "$STATUS"


      # ========================================
      # 5. FIND APPLICATION
      # ========================================
      - name: Find application
        if: success()
        run: |
          echo "========================================"
          echo "BUILT APPLICATION"
          echo "========================================"

          find build/DerivedData/Build/Products \
            -name "*.app" \
            -type d \
            -print


      # ========================================
      # 6. PACKAGE APPLICATION
      # ========================================
      - name: Package application
        if: success()
        shell: bash
        run: |
          set -e

          APP_PATH=$(find build/DerivedData/Build/Products \
            -name "*.app" \
            -type d \
            | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found"
            exit 1
          fi

          echo "APPLICATION:"
          echo "$APP_PATH"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/

          rm -f LinuxKit-iSH-ARM64.zip

          zip -r LinuxKit-iSH-ARM64.zip Payload


      # ========================================
      # 7. UPLOAD ARTIFACT
      # ========================================
      - name: Upload LinuxKit build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LinuxKit-iSH-ARM64
          path: LinuxKit-iSH-ARM64.zip
          if-no-files-found: error
