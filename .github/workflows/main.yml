name: Build LinuxKit iOS ARM64

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: xcode-27

    steps:

      # ============================================================
      # 1. CHECKOUT SOURCE
      # ============================================================
      - name: Checkout LinuxKit
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ============================================================
      # 2. INSTALL ONLY MESON + NINJA
      # ============================================================
      - name: Install Meson and Ninja
        shell: bash
        run: |
          set -e

          brew install meson ninja

          echo "========================================"
          echo "MESON"
          echo "========================================"
          command -v meson
          meson --version

          echo "========================================"
          echo "NINJA"
          echo "========================================"
          command -v ninja
          ninja --version

      # ============================================================
      # 3. FIX XCODE 27 DISPATCH HEADER ISSUE
      # ============================================================
      - name: Prepare Xcode 27 compatibility
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "platform/darwin.c BEFORE PATCH"
          echo "========================================"

          sed -n '1,50p' platform/darwin.c

          echo
          echo "========================================"
          echo "ADDING DISPATCH HEADER IF NEEDED"
          echo "========================================"

          if ! grep -q '#include <dispatch/dispatch.h>' platform/darwin.c; then
            sed -i.bak \
              '1i\
          #include <dispatch/dispatch.h>\
          ' \
              platform/darwin.c
          fi

          echo
          echo "========================================"
          echo "platform/darwin.c AFTER PATCH"
          echo "========================================"

          sed -n '1,50p' platform/darwin.c

      # ============================================================
      # 4. CHECK XCODE / IOS SDK
      # ============================================================
      - name: Check Xcode and iOS SDK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "XCODE"
          echo "========================================"

          xcodebuild -version
          xcode-select -p

          echo
          echo "========================================"
          echo "IOS SDK"
          echo "========================================"

          xcrun --sdk iphoneos --show-sdk-version
          xcrun --find clang

          echo
          echo "========================================"
          echo "CLANG"
          echo "========================================"

          xcrun clang --version

          echo
          echo "========================================"
          echo "MESON / NINJA"
          echo "========================================"

          meson --version
          ninja --version

      # ============================================================
      # 5. BUILD iSH-ARM64
      # ============================================================
      - name: Build iSH-ARM64
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "BUILD LINUXKIT iSH-ARM64"
          echo "========================================"

          xcodebuild \
            -project iSH.xcodeproj \
            -scheme iSH-ARM64 \
            -configuration Debug-ApplePleaseFixFB19282108 \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build > build.log 2>&1

          STATUS=$?

          echo
          echo "========================================"
          echo "IMPORTANT ERRORS"
          echo "========================================"

          grep -inE \
            "error:|Error:|FAILED|failed|fatal|cannot|not found|Undefined symbols|unknown type name|undeclared" \
            build.log \
            | tail -150 || true

          echo
          echo "========================================"
          echo "LIBRARIES CREATED"
          echo "========================================"

          find build/DerivedData/Build/Products \
            \( \
              -name "libish.a" \
              -o -name "libish_emu.a" \
              -o -name "libfakefs.a" \
              -o -name "libarchive.a" \
            \) \
            -type f \
            -print

          echo
          echo "========================================"
          echo "BUILD STATUS"
          echo "========================================"

          echo "STATUS=$STATUS"

          exit "$STATUS"

      # ============================================================
      # 6. FIND APP
      # ============================================================
      - name: Find application
        if: success()
        shell: bash
        run: |
          echo "========================================"
          echo "APPLICATION"
          echo "========================================"

          find build/DerivedData/Build/Products \
            -name "*.app" \
            -type d \
            -print

      # ============================================================
      # 7. PACKAGE APP
      # ============================================================
      - name: Package application
        if: success()
        shell: bash
        run: |
          set -e

          APP_PATH=$(find build/DerivedData/Build/Products \
            -name "*.app" \
            -type d \
            | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found"
            exit 1
          fi

          echo "========================================"
          echo "APPLICATION FOUND"
          echo "========================================"

          echo "$APP_PATH"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/

          rm -f LinuxKit-iSH-ARM64.zip

          zip -r LinuxKit-iSH-ARM64.zip Payload

      # ============================================================
      # 8. UPLOAD ARTIFACT
      # ============================================================
      - name: Upload LinuxKit build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LinuxKit-iSH-ARM64
          path: LinuxKit-iSH-ARM64.zip
          if-no-files-found: error
