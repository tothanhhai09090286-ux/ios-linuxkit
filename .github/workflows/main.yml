name: Build LinuxKit iOS ARM64

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: xcode-27

    steps:

      - name: Checkout LinuxKit
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check Xcode and iOS SDK
        run: |
          xcodebuild -version
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build iSH-ARM64
        shell: bash
        run: |
          set +e

          LIB_PATH="$GITHUB_WORKSPACE/build/DerivedData/Build/Products/Debug-ApplePleaseFixFB19282108-iphoneos"

          echo "========================================"
          echo "BUILD iSH-ARM64"
          echo "========================================"
          echo "LIBRARY PATH:"
          echo "$LIB_PATH"
          echo

          xcodebuild \
            -project iSH.xcodeproj \
            -scheme iSH-ARM64 \
            -configuration Debug-ApplePleaseFixFB19282108 \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            LIBRARY_SEARCH_PATHS='$(inherited) '"$LIB_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build > build.log 2>&1

          BUILD_STATUS=$?

          echo
          echo "========================================"
          echo "BUILD RESULT"
          echo "========================================"

          if [ "$BUILD_STATUS" -eq 0 ]; then
            echo "BUILD SUCCEEDED"
          else
            echo "BUILD FAILED"
            echo
            echo "========================================"
            echo "ACTUAL ERRORS"
            echo "========================================"

            grep -E \
              "error:|ld:|Undefined symbols|symbol\(s\) not found|library .* not found" \
              build.log \
              | tail -100

            echo
            echo "========================================"
            echo "LAST 30 BUILD LOG LINES"
            echo "========================================"

            tail -30 build.log
          fi

          echo
          echo "========================================"
          echo "LIBISH"
          echo "========================================"

          find build/DerivedData/Build/Products \
            -name "libish.a" \
            -type f \
            -print

          echo
          echo "========================================"
          echo "LIBISH_EMU"
          echo "========================================"

          find build/DerivedData/Build/Products \
            -name "libish_emu.a" \
            -type f \
            -print

          exit "$BUILD_STATUS"

      - name: Find application
        if: success()
        run: |
          find build/DerivedData/Build/Products \
            -name "*.app" \
            -type d \
            -print

      - name: Package application
        if: success()
        run: |
          set -e

          APP_PATH=$(find build/DerivedData/Build/Products \
            -name "*.app" \
            -type d \
            | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found"
            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          rm -f LinuxKit-iSH-ARM64.zip
          zip -r LinuxKit-iSH-ARM64.zip Payload

      - name: Upload LinuxKit build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LinuxKit-iSH-ARM64
          path: LinuxKit-iSH-ARM64.zip
          if-no-files-found: error
