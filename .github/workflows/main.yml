name: Build LinuxKit iOS ARM64

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: xcode-27

    steps:

      # ========================================
      # 1. CHECKOUT
      # ========================================
      - name: Checkout LinuxKit
        uses: actions/checkout@v4
        with:
          submodules: recursive


      # ========================================
      # 2. INSTALL MESON + NINJA
      # ========================================
      - name: Install Meson and Ninja
        shell: bash
        run: |
          set -e

          echo "Installing Meson and Ninja..."

          brew install meson ninja

          echo
          echo "=== MESON ==="
          command -v meson
          meson --version

          echo
          echo "=== NINJA ==="
          command -v ninja
          ninja --version


      # ========================================
      # 3. CHECK XCODE / SDK
      # ========================================
      - name: Check Xcode and iOS SDK
        run: |
          echo "=== XCODE ==="
          xcodebuild -version

          echo
          echo "=== IOS SDK ==="
          xcrun --sdk iphoneos --show-sdk-version

          echo
          echo "=== MESON ==="
          command -v meson
          meson --version

          echo
          echo "=== NINJA ==="
          command -v ninja
          ninja --version


      # ========================================
      # 4. BUILD iSH-ARM64
      # ========================================
      - name: Build iSH-ARM64
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "BUILD iSH-ARM64"
          echo "========================================"

          echo
          echo "Meson:"
          command -v meson
          meson --version

          echo
          echo "Ninja:"
          command -v ninja
          ninja --version

          echo
          echo "Running Xcode build..."

          xcodebuild \
            -project iSH.xcodeproj \
            -scheme iSH-ARM64 \
            -configuration Debug-ApplePleaseFixFB19282108 \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build > build.log 2>&1

          STATUS=$?

          echo
          echo "========================================"
          echo "MESON / NINJA ERRORS"
          echo "========================================"

          grep -inE \
            "meson:|ninja: error|error:|ld:|Undefined symbols|not found|failed" \
            build.log \
            | tail -100 || true

          echo
          echo "========================================"
          echo "LIBRARIES"
          echo "========================================"

          find build/DerivedData/Build/Products \
            \( \
              -name "libish.a" \
              -o -name "libish_emu.a" \
              -o -name "libfakefs.a" \
              -o -name "libarchive.a" \
            \) \
            -type f \
            -print

          echo
          echo "========================================"
          echo "BUILD STATUS"
          echo "========================================"

          echo "$STATUS"

          exit "$STATUS"


      # ========================================
      # 5. FIND APPLICATION
      # ========================================
      - name: Find application
        if: success()
        run: |
          echo "=== APPLICATION ==="

          find build/DerivedData/Build/Products \
            -name "*.app" \
            -type d \
            -print


      # ========================================
      # 6. PACKAGE
      # ========================================
      - name: Package application
        if: success()
        run: |
          set -e

          APP_PATH=$(find build/DerivedData/Build/Products \
            -name "*.app" \
            -type d \
            | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found"
            exit 1
          fi

          echo "APPLICATION:"
          echo "$APP_PATH"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/

          rm -f LinuxKit-iSH-ARM64.zip

          zip -r LinuxKit-iSH-ARM64.zip Payload


      # ========================================
      # 7. UPLOAD
      # ========================================
      - name: Upload LinuxKit build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LinuxKit-iSH-ARM64
          path: LinuxKit-iSH-ARM64.zip
          if-no-files-found: error
