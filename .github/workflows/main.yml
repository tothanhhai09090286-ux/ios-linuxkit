name: Build LinuxKit iOS ARM64

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: xcode-27

    steps:

      # ========================================
      # 1. CHECKOUT
      # ========================================
      - name: Checkout LinuxKit
        uses: actions/checkout@v4
        with:
          submodules: recursive


      # ========================================
      # 2. CHECK XCODE / IOS SDK
      # ========================================
      - name: Check Xcode and iOS SDK
        run: |
          echo "=== XCODE ==="
          xcodebuild -version

          echo
          echo "=== XCODE SELECT ==="
          xcode-select -p

          echo
          echo "=== IOS SDK ==="
          xcrun --sdk iphoneos --show-sdk-version

          echo
          echo "=== PROJECT SCHEMES ==="
          xcodebuild \
            -project iSH.xcodeproj \
            -list


      # ========================================
      # 3. BUILD iSH-ARM64
      # ========================================
      - name: Build iSH-ARM64
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "BUILD iSH-ARM64"
          echo "========================================"

          LIB_PATH="$GITHUB_WORKSPACE/build/DerivedData/Build/Products/Debug-ApplePleaseFixFB19282108-iphoneos"

          echo
          echo "LIBRARY PATH:"
          echo "$LIB_PATH"

          xcodebuild \
            -project iSH.xcodeproj \
            -scheme iSH-ARM64 \
            -configuration Debug-ApplePleaseFixFB19282108 \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            LIBRARY_SEARCH_PATHS='$(inherited) '"$LIB_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log

          BUILD_STATUS=${PIPESTATUS[0]}

          echo
          echo "========================================"
          echo "ACTUAL ERRORS"
          echo "========================================"

          grep -E \
            "error:|ld:|Undefined symbols|symbol\(s\) not found|library .* not found" \
            build.log \
            | tail -100

          echo
          echo "========================================"
          echo "LIBISH CHECK"
          echo "========================================"

          find build/DerivedData/Build/Products \
            -name "libish.a" \
            -type f \
            -print

          echo
          echo "========================================"
          echo "LIBISH_EMU CHECK"
          echo "========================================"

          find build/DerivedData/Build/Products \
            -name "libish_emu.a" \
            -type f \
            -print

          echo
          echo "========================================"
          echo "BUILD EXIT CODE"
          echo "========================================"

          echo "$BUILD_STATUS"

          exit "$BUILD_STATUS"


      # ========================================
      # 4. FIND APPLICATION
      # ========================================
      - name: Find application
        if: success()
        run: |
          echo "=== Built applications ==="

          find build/DerivedData/Build/Products \
            -name "*.app" \
            -type d \
            -print


      # ========================================
      # 5. PACKAGE APPLICATION
      # ========================================
      - name: Package application
        if: success()
        run: |
          set -e

          APP_PATH=$(find build/DerivedData/Build/Products \
            -name "*.app" \
            -type d \
            | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found"
            exit 1
          fi

          echo "Found application:"
          echo "$APP_PATH"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/

          rm -f LinuxKit-iSH-ARM64.zip

          zip -r LinuxKit-iSH-ARM64.zip Payload


      # ========================================
      # 6. UPLOAD ARTIFACT
      # ========================================
      - name: Upload LinuxKit build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LinuxKit-iSH-ARM64
          path: LinuxKit-iSH-ARM64.zip
          if-no-files-found: error
